[project]
name = "genai-next"
version = "0.1.0"
description = "Hello-GenAI — FastAPI + Postgres + Redis + Celery backend for local LLM chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "celery==5.4.0",
    "flower==2.0.1",
    "httpx==0.28.1",
    "typer==0.15.1",
    "rich==13.9.4",
    "pyjwt==2.13.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.32",
    "pypdf==5.1.0",
    "websockets==14.1",
    # DiceBear avatars — rendered locally/offline, deterministic per seed.
    "dicebear-core==10.3.0",
    "dicebear-styles==10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.4",
]

[project.scripts]
genai = "genai.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
