server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolved per-request (via a variable in proxy_pass)
    # so nginx boots even while the API is still starting, and picks up a new
    # container IP if the API restarts.
    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 32m;   # knowledge-base uploads

    # ── Same-origin API proxy ────────────────────────────────────────────────
    # The SPA calls relative URLs (/api, /v1, /ws), so the app works from ANY
    # device on the network — phone, tablet, another laptop — with no baked-in
    # hostname and no cross-origin requests (hence no CORS configuration).
    location ~ ^/(api|v1)/ {
        set $api http://api:8000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;               # SSE fallback (/api/chat/stream) must stream
        proxy_read_timeout 1h;
    }

    # WebSocket chat streaming
    location /ws/ {
        set $api http://api:8000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API docs, schema, health
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        set $api http://api:8000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker + manifest must never be cached, or a device can be pinned
    # to an old worker that serves a deleted build.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /sw.js =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    # Standalone marketing/preview page. Never cached, so a phone that visited
    # an older build always gets the current page instead of a stale copy.
    location = /preview {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /preview.html =404;
    }

    # Hashed, content-addressed build output — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. index.html must NOT be cached: it names the hashed asset
    # bundles, so a stale copy pins a device to an old (or deleted) build.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
