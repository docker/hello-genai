name: py-genai-next CI

on:
  push:
    paths:
      - "py-genai-next/**"
      - ".github/workflows/py-genai-next-ci.yml"
  pull_request:
    paths:
      - "py-genai-next/**"
      - ".github/workflows/py-genai-next-ci.yml"

defaults:
  run:
    working-directory: py-genai-next

jobs:
  backend:
    name: Backend · lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit tests (infra-free)
        run: python -m pytest tests -q

  migrations:
    name: Migrations · upgrade + schema drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: genai
          POSTGRES_PASSWORD: genai
          POSTGRES_DB: genai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
      POSTGRES_DB: genai
      SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Fail on model/migration drift
        run: alembic check

      - name: Round-trip downgrade
        run: alembic downgrade base

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py-genai-next/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: py-genai-next/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t py-genai-next-api:ci .

      - name: Build frontend image
        run: docker build -t py-genai-next-frontend:ci ./frontend
