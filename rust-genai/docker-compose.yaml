services:
  rust-genai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    restart: unless-stopped
    models:
      - llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

models:
  llm:
    model: ai/llama3.2:1B-Q8_0
