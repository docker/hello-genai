<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello-GenAI</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" id="hljs-theme" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- System Prompt Modal -->
    <div id="prompt-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span><i class="fas fa-sliders"></i>&nbsp; System Prompt</span>
                <button id="prompt-close" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <textarea id="system-prompt-input" placeholder="Describe how the assistant should behave. Leave blank to use the default."></textarea>
            </div>
            <div class="modal-footer">
                <button id="prompt-save" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="stats-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span><i class="fas fa-chart-bar"></i>&nbsp; Usage Dashboard</span>
                <button id="stats-close" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-sessions">—</div>
                        <div class="stat-label">Conversations</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-messages">—</div>
                        <div class="stat-label">Messages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-tokens">—</div>
                        <div class="stat-label">Total Tokens</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-prompt">—</div>
                        <div class="stat-label">Prompt Tokens</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-completion">—</div>
                        <div class="stat-label">Completion Tokens</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <div style="display:flex;align-items:center;gap:0.6rem;">
                <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar (⌘/)">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <i class="fas fa-robot logo-icon"></i>
                    <span class="logo-text">Hello-GenAI</span>
                </div>
            </div>
            <div class="header-controls">
                <select id="model-select" class="model-select" title="Select model"></select>
                <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- App layout -->
    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <button id="new-chat-btn" class="btn-new-chat" title="New chat (⌘K)">
                <i class="fas fa-plus"></i> New Chat
            </button>
            <div id="session-list" class="session-list"></div>
            <div class="sidebar-footer">
                <a href="/preview"  class="sidebar-link"><i class="fas fa-eye"></i> Preview</a>
                <a href="/api/docs" class="sidebar-link"><i class="fas fa-book"></i> API Docs</a>
                <a href="/health"   class="sidebar-link"><i class="fas fa-heartbeat"></i> Health</a>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-area">
            <div class="chat-wrapper">

                <!-- Toolbar -->
                <div class="chat-toolbar">
                    <button id="prompt-btn"  class="toolbar-btn" title="Edit system prompt">
                        <i class="fas fa-sliders"></i> System Prompt
                    </button>
                    <button id="search-btn"  class="toolbar-btn" title="Search messages (⌘F)">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <button id="export-btn"  class="toolbar-btn" title="Export conversation">
                        <i class="fas fa-download"></i> Export
                    </button>
                    <button id="stats-btn"   class="toolbar-btn" title="Usage dashboard">
                        <i class="fas fa-chart-bar"></i> Stats
                    </button>
                    <button id="clear-chat"  class="toolbar-btn" title="Clear messages (⌘L)">
                        <i class="fas fa-trash-alt"></i> Clear
                    </button>
                    <span id="context-badge" class="context-badge" style="display:none">
                        <i class="fas fa-layer-group"></i>&nbsp;<span id="context-tokens">0</span>&nbsp;tokens
                    </span>
                </div>

                <!-- Search bar (hidden until toggled) -->
                <div id="search-bar" class="search-bar" style="display:none">
                    <i class="fas fa-search" style="color:var(--text-muted);font-size:0.85rem;"></i>
                    <input type="text" id="search-input" placeholder="Filter messages…">
                    <button id="search-close" class="icon-btn" title="Close search"><i class="fas fa-times"></i></button>
                </div>

                <!-- Messages -->
                <div id="chat-box"></div>

                <!-- Input -->
                <div class="input-area">
                    <textarea id="message-input" placeholder="Type your message… (Shift+Enter for newline)" rows="1"></textarea>
                    <div class="input-buttons">
                        <button id="stop-button" class="btn-stop" style="display:none" title="Stop generation (Esc)">
                            <i class="fas fa-stop-circle"></i>
                        </button>
                        <button id="send-button" class="btn-send" disabled title="Send (Enter)">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- CDN libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" crossorigin="anonymous"></script>

    <script type="module">
        import { initModelSelector }                        from "/static/js/models.js";
        import { renderSessionList, createAndSwitchSession, onSessionSwitch } from "/static/js/sessions.js";
        import { initExport }                               from "/static/js/export.js";
        import { initChat, renderMessages }                 from "/static/js/chat.js";

        marked.setOptions({ breaks: true, gfm: true });

        initChat();
        initModelSelector(document.getElementById("model-select"));
        initExport(document.getElementById("export-btn"));

        onSessionSwitch((_id, messages) => renderMessages(messages));

        await renderSessionList();

        document.getElementById("new-chat-btn").addEventListener("click", async () => {
            await createAndSwitchSession();
            renderMessages([]);
        });

        // Keep highlight.js theme in sync with dark mode
        const hljsTheme = document.getElementById("hljs-theme");
        new MutationObserver(() => {
            const dark = document.body.classList.contains("dark-mode");
            hljsTheme.href = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${dark ? "github-dark" : "github"}.min.css`;
        }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
    </script>
</body>
</html>
