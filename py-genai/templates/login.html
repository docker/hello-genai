<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Hello-GenAI</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <style>
        :root { --blue:#0078D7; --dark:#0f172a; --border:#e2e8f0; --muted:#64748b; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%); color:var(--dark); padding:1rem;
        }
        .card {
            background:#fff; border-radius:16px; padding:2.5rem 2.25rem; width:100%; max-width:380px;
            box-shadow:0 20px 60px rgba(0,0,0,0.35); text-align:center;
        }
        .logo {
            width:60px; height:60px; margin:0 auto 1.25rem; border-radius:16px;
            background:linear-gradient(135deg,#0078D7,#00c2ff); display:flex; align-items:center;
            justify-content:center; color:#fff; font-size:1.6rem;
        }
        h1 { font-size:1.35rem; margin-bottom:0.35rem; letter-spacing:-0.02em; }
        p.sub { color:var(--muted); font-size:0.9rem; margin-bottom:1.5rem; }
        input {
            width:100%; padding:0.7rem 0.9rem; border:1.5px solid var(--border); border-radius:10px;
            font-size:0.95rem; margin-bottom:1rem; transition:border-color .15s;
        }
        input:focus { outline:none; border-color:var(--blue); }
        button {
            width:100%; padding:0.7rem; border:none; border-radius:10px; background:var(--blue);
            color:#fff; font-size:0.95rem; font-weight:600; cursor:pointer; transition:background .15s;
        }
        button:hover { background:#005a9e; }
        .error {
            background:#fee2e2; color:#b91c1c; border-radius:8px; padding:0.55rem 0.75rem;
            font-size:0.85rem; margin-bottom:1rem;
        }
    </style>
</head>
<body>
    <form class="card" method="POST" action="/login{{ '?next=' + request.args.get('next') if request.args.get('next') else '' }}">
        <div class="logo"><i class="fas fa-robot"></i></div>
        <h1>Hello-GenAI</h1>
        <p class="sub">Enter your access key to continue</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="password" name="api_key" placeholder="Access key" autofocus autocomplete="current-password" required>
        <button type="submit"><i class="fas fa-lock-open"></i>&nbsp; Sign in</button>
    </form>
</body>
</html>
