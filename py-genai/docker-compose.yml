services:
  python-genai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - LOG_LEVEL=INFO
    env_file:
      - ../.env
    restart: unless-stopped
    models:
      - llm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - .:/app

models:
  llm:
    model: ai/llama3.2:1B-Q8_0

networks:
  default:
    name: python-genai-network
    driver: bridge