services:
  python-genai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - LOG_LEVEL=INFO
      - LLAMA_URL=http://127.0.0.1:12434/engines/llama.cpp/v1
      - LLAMA_MODEL=docker.io/ai/gemma4:latest
      - AVAILABLE_MODELS=docker.io/ai/gemma4:latest,docker.io/ai/gemma3n:latest
    models:
      - gemma4
      - gemma3n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

models:
  gemma4:
    model: docker.io/ai/gemma4:latest
    context_size: 4096
  gemma3n:
    model: docker.io/ai/gemma3n:latest
    context_size: 4096
